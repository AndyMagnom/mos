<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>MedPrep</title>

  <!-- Splitting.js - bundled locally (see splitting.min.js / splitting.css)
       so the splash never depends on network state. -->
  <link rel="stylesheet" href="splitting.css" />

  <style>
    :root {
      --duration: 6s;
      --wave-duration: calc(var(--duration) * 0.25);
      --text-in-delay: calc(var(--duration) * 0.275);
      --text-in-duration: calc(var(--duration) * 0.1);
      --easing: cubic-bezier(0.5, 0, 0.5, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      position: relative;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      /* Splash backdrop matches the Access Denied / connection-error
         screen's backdrop exactly (@color/error_page_bg in colors.xml). */
      background: #1E2124;
      font-family: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: grid;
      align-items: center;
      justify-items: center;
      z-index: 1;
    }

    /* =========================
       BACKDROP (from bg_error_screen.xml / bg_error_screen_animated.xml)
       - same artwork + same twinkle/glow timing as the Access Denied
       screen, converted from the animator XMLs' fillAlpha keyframes.
       ========================= */

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .backdrop svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* error_bg_twinkle_a: 1400ms, no delay */
    #sparkle1, #star_c {
      animation: twinkle 2800ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* error_bg_twinkle_b: 1800ms, 300ms delay */
    #sparkle2, #star_a, #firefly2 {
      animation: twinkle 3600ms cubic-bezier(0.4, 0, 0.2, 1) 300ms infinite;
    }

    /* error_bg_twinkle_c: 2200ms, 700ms delay */
    #star_b, #star_d, #firefly1 {
      animation: twinkle 4400ms cubic-bezier(0.4, 0, 0.2, 1) 700ms infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }

    /* error_bg_glow_pulse_outer: 3200ms, no delay, 0.5-1 */
    #glow_outer {
      animation: glow-outer 6400ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes glow-outer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* error_bg_glow_pulse_inner: 2600ms, 400ms delay, 0.6-1 */
    #glow_inner {
      animation: glow-inner 5200ms cubic-bezier(0.4, 0, 0.2, 1) 400ms infinite;
    }

    @keyframes glow-inner {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .container > * {
      grid-area: 1 / 1;
    }

    .title {
      font-size: 10vmin;
      font-weight: 900;
      margin: 0;
    }

    .med {
      color: #ad0302;
    }

    .prep {
      color: #FFFFFF;
    }

    /* =========================
       TEXT ANIMATION
       ========================= */

    .title .char {
      --delay: calc(
        var(--text-in-delay) +
        (0.25s * (1 - var(--distance-percent)))
      );

      animation:
        text-in
        var(--text-in-duration)
        var(--easing)
        var(--delay)
        backwards;

      transform-origin: center 1em;
    }

    @keyframes text-in {
      0% {
        opacity: 0;
        transform:
          translateX(calc(-0.4em * var(--char-offset)))
          scale(0);
      }

      90% {
        transform:
          translateX(0em)
          scale(1.1);
      }
    }

    .title .char[data-char="t"],
    .title .char[data-char="i"] {
      visibility: hidden;
      --squish-scale: 0.6;
      --squish-y: 10%;
    }

    .title .char[data-char="t"]::before,
    .title .char[data-char="i"]::before {
      animation:
        text-squish
        var(--duration)
        var(--easing)
        forwards;

      visibility: visible;
      transform-origin: center 1em;
    }

    .title .char[data-char="i"] {
      --squish-scale: 0.9;
      --squish-y: 5%;
    }

    @keyframes text-squish {
      47.5%,
      52.5% {
        transform: none;
      }

      50% {
        transform:
          translateY(var(--squish-y))
          scaleY(var(--squish-scale));
      }
    }

        /* Only the P gets the bump */
    .title .char[data-char="p"] {
      animation:
        text-in
        var(--text-in-duration)
        var(--easing)
        var(--delay)
        backwards,

        text-bonk
        var(--duration)
        var(--easing)
        forwards;
    }

    @keyframes text-bonk {
      80%,
      85%,
      to {
        transform: none;
      }

      82% {
        transform: translateX(-20%);
      }
    }

    /* =========================
       IMAGE / DOT
       ========================= */

    .dot {
      font-size: 5vmin;

      width: 1em;
      height: 1em;

      animation:
        dot
        var(--duration)
        var(--easing)
        both;
    }

    .dot-inner {
      animation:
        dot-inner
        var(--duration)
        var(--easing)
        both;

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      display: grid;
      align-items: center;
      justify-items: center;
    }

    .dot-image {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;

      /* Circular crop, matches the source template's default. */
      border-radius: 50%;
    }

    /* =========================
       ORIGINAL DOT MOVEMENT
       ========================= */

    @keyframes dot {
      /*
        10% fade in
        20% shoot up
        30% bounce down
        40% shoot up
        50% bounce down
        60% bounce right
        70% land right
        80% bump word left
        90% bubble
        100% pause
      */

      from {
        opacity: 0;
        transform: scale(3);
      }

      10% {
        opacity: 1;
        transform: scale(3);
      }

      15% {
        transform:
          scale(3)
          translateY(0.5em)
          scaleY(1.5);
      }

      20% {
        transform:
          scale(1)
          translateY(-300%);
      }

      30% {
        transform:
          translateY(1em)
          scaleY(0.5);
      }

      40% {
        transform:
          translateY(-400%);
      }

      50% {
        transform:
          translateY(-1em);
      }

      53% {
        transform:
          translateY(-300%);
      }

      56% {
        transform:
          translateY(-0.6em);
      }

      59% {
        transform:
          translateY(-200%);
      }

      62% {
        transform:
          translateY(1em);
      }

      80%,
      90%,
      to {
        transform:
          translateY(1em);
      }
    }

    @keyframes dot-inner {
      from,
      45% {
        transform: none;
      }

      70% {
        transform: translateX(6em);

        animation-timing-function:
          cubic-bezier(0.5, 0, 1, 0);
      }

      80% {
        transform: translateX(3.7em);

        animation-timing-function:
          var(--easing);
      }

      83%,
      to {
        transform: translateX(5em);
      }
    }

    /* =========================
       SYNCHRONIZATION
       ========================= */

    body:not([data-play]) *,
    body:not([data-play]) *::before,
    body:not([data-play]) *::after {
      visibility: hidden;
      animation: none !important;
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>

<body>

  <!-- Ported 1:1 from bg_error_screen.xml (pathData -> d, fillColor -> fill).
       preserveAspectRatio="none" matches how the vector stretches to the
       view bounds natively in the app. -->
  <div class="backdrop">
    <svg viewBox="0 0 411 891" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect fill="#1E2124" x="0" y="0" width="411" height="891" />

      <!-- Stars -->
      <path id="star_a" fill="#26FFFFFF" d="M40,60 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
      <path fill="#40FFFFFF" d="M92,140 m-1.5,0 a1.5,1.5 0 1,1 3,0 a1.5,1.5 0 1,1 -3,0" />
      <path id="star_b" fill="#1FFFFFFF" d="M152,52 m-2.5,0 a2.5,2.5 0 1,1 5,0 a2.5,2.5 0 1,1 -5,0" />
      <path fill="#38FFFFFF" d="M232,112 m-1.8,0 a1.8,1.8 0 1,1 3.6,0 a1.8,1.8 0 1,1 -3.6,0" />
      <path id="star_c" fill="#2EFFFFFF" d="M310,70 m-2.2,0 a2.2,2.2 0 1,1 4.4,0 a2.2,2.2 0 1,1 -4.4,0" />
      <path fill="#45FFFFFF" d="M370,160 m-1.5,0 a1.5,1.5 0 1,1 3,0 a1.5,1.5 0 1,1 -3,0" />
      <path fill="#30FFFFFF" d="M60,262 m-1.8,0 a1.8,1.8 0 1,1 3.6,0 a1.8,1.8 0 1,1 -3.6,0" />
      <path id="star_d" fill="#26FFFFFF" d="M200,224 m-1.5,0 a1.5,1.5 0 1,1 3,0 a1.5,1.5 0 1,1 -3,0" />
      <path fill="#33FFFFFF" d="M330,272 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
      <path fill="#24FFFFFF" d="M120,332 m-1.6,0 a1.6,1.6 0 1,1 3.2,0 a1.6,1.6 0 1,1 -3.2,0" />
      <path fill="#2BFFFFFF" d="M280,352 m-1.4,0 a1.4,1.4 0 1,1 2.8,0 a1.4,1.4 0 1,1 -2.8,0" />
      <path fill="#30FFFFFF" d="M390,322 m-1.8,0 a1.8,1.8 0 1,1 3.6,0 a1.8,1.8 0 1,1 -3.6,0" />
      <path fill="#3DB39DDB" d="M180,92 m-2.4,0 a2.4,2.4 0 1,1 4.8,0 a2.4,2.4 0 1,1 -4.8,0" />
      <path fill="#38B39DDB" d="M350,242 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
      <path fill="#46B39DDB" d="M32,192 m-1.6,0 a1.6,1.6 0 1,1 3.2,0 a1.6,1.6 0 1,1 -3.2,0" />
      <path fill="#3DF98012" d="M262,172 m-1.8,0 a1.8,1.8 0 1,1 3.6,0 a1.8,1.8 0 1,1 -3.6,0" />
      <path fill="#38F98012" d="M100,292 m-1.5,0 a1.5,1.5 0 1,1 3,0 a1.5,1.5 0 1,1 -3,0" />

      <!-- Sparkles -->
      <path id="sparkle1" fill="#4DFFFFFF" d="M330,130 L332.4,135.6 L338,138 L332.4,140.4 L330,146 L327.6,140.4 L322,138 L327.6,135.6 Z" />
      <path id="sparkle2" fill="#59B39DDB" d="M75,96 L76.8,99.2 L80,101 L76.8,102.8 L75,106 L73.2,102.8 L70,101 L73.2,99.2 Z" />

      <!-- Orange glow -->
      <path id="glow_outer" fill="#21F98012" d="M431,642 m-172,0 a172,172 0 1,1 344,0 a172,172 0 1,1 -344,0" />
      <path id="glow_inner" fill="#2EF98012" d="M431,642 m-112,0 a112,112 0 1,1 224,0 a112,112 0 1,1 -224,0" />

      <!-- Hills -->
      <path fill="#7C4B5C" d="M0,772 C80,740 152,726 226,744 C300,762 352,786 411,776 L411,891 L0,891 Z" />
      <path fill="#5E3A4A" d="M0,804 C70,782 160,778 240,798 C320,818 380,814 411,804 L411,891 L0,891 Z" />

      <!-- Bushes -->
      <path fill="#0E5F66" d="M-24,858 C28,812 92,806 132,840 C172,872 122,891 60,891 L-24,891 Z" />
      <path fill="#0B5158" d="M436,848 C384,810 300,812 262,844 C230,870 282,891 342,891 L436,891 Z" />
      <path fill="#083A40" d="M0,891 L0,864 C60,838 142,836 202,860 C262,884 332,882 411,858 L411,891 Z" />

      <!-- Fireflies -->
      <path id="firefly1" fill="#59F98012" d="M142,848 m-2.5,0 a2.5,2.5 0 1,1 5,0 a2.5,2.5 0 1,1 -5,0" />
      <path id="firefly2" fill="#4DF98012" d="M302,868 m-2,0 a2,2 0 1,1 4,0 a2,2 0 1,1 -4,0" />
    </svg>
  </div>

  <div class="container">

    <h1 class="title" data-splitting>
      <span class="med">Med</span><span class="prep">Prep</span>
    </h1>

    <div class="dot">
      <div class="dot-inner">

        <img
          class="dot-image"
          src="logo.png"
          alt=""
        />

      </div>
    </div>

  </div>

  <!-- Splitting.js -->
  <script src="splitting.min.js"></script>

  <script>
    Splitting();

    const el = document.body;

    el.addEventListener("click", function () {
      el.hidden = true;

      requestAnimationFrame(() => {
        el.hidden = false;
      });
    });

    requestAnimationFrame(() => {
      document.body.dataset.play = true;
    });
  </script>

</body>
</html>
